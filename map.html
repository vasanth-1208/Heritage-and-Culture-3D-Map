<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View on Map – Heritage & Culture India</title>
    <meta name="description"
        content="Explore India's destinations on an interactive map. Click markers to discover virtual tours across the country.">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="https://www.localhost:8000/map.html">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Explore Destinations on Map",
        "url": "https://www.localhost:8000/map.html",
        "description": "Interactive map to explore virtual tourism destinations across India.",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Heritage & Culture",
          "url": "https://www.localhost:8000/"
        }
      }
    </script>
</head>

<body class="map-page">

    <!-- ═══ MAP HEADER BAR ═══ -->
    <header class="map-header">
        <a href="index.html" class="map-header-logo">
            <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="14" stroke="#C5A45C" stroke-width="2" />
                <circle cx="16" cy="16" r="4" fill="#C5A45C" />
            </svg>
            <span>Heritage & Culture</span>
        </a>
        <h1 class="map-header-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C5A45C" stroke-width="2"
                stroke-linecap="round" style="vertical-align:-2px;margin-right:6px">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                <circle cx="12" cy="10" r="3" />
            </svg>
            Explore on Map
        </h1>
        <a href="virtual-tourism.html" class="map-header-back" aria-label="Back to destinations">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M19 12H5M5 12L11 6M5 12L11 18" />
            </svg>
            Back
        </a>
    </header>

    <!-- ═══ FULL PAGE MAP ═══ -->
    <div id="destinationMap" class="fullpage-map"></div>

    <!-- ═══ CATEGORY BAR (bottom) ═══ -->
    <div class="map-category-bar">
        <button id="catScrollLeft" class="map-cat-arrow map-cat-arrow-left" aria-label="Scroll left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M15 18L9 12L15 6" />
            </svg>
        </button>
        <div id="mapCategoryTrack" class="map-category-track"></div>
        <button id="catScrollRight" class="map-cat-arrow map-cat-arrow-right" aria-label="Scroll right">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round">
                <path d="M9 18L15 12L9 6" />
            </svg>
        </button>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/analytics.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
    <script src="js/map.js"></script>
</body>

</html>
