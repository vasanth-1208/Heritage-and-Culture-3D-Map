<body>

    <!-- ═══ NAVBAR ═══ -->
    <div id="navbar"></div>

    <!-- ═══ KRPANO VIEWER (direct-embed architecture) ═══ -->
    <!--
        destination.js dynamically loads the per-tour compiled tour.js in parallel
        with /api/tour-access auth. Once both complete it calls embedpano() directly
        into #pano — no nested iframe, no second auth, no postMessage bridge needed.
        Controls (language, mute, VR, FS) call window.vtKrpano directly.
    -->
    <section class="dest-viewer-section">
        <div id="tourViewer" class="tour-viewer-container" style="width:100%; height:100vh; position:relative;">

            <!-- KRPano renders directly into this div after auth + tour.js load -->
            <div id="pano" style="position:absolute;top:0;left:0;width:100%;height:100%;"></div>

            <!-- Loading State (shown until iframe signals VT_TOUR_READY) -->
            <div id="tourLoading" class="tour-state-panel active">
                <div class="spinner"></div>
                <p>Loading Virtual Tour...</p>
            </div>

            <!-- Error State -->
            <div id="tourError" class="tour-state-panel" style="display: none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
                    stroke-linecap="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="15" y1="9" x2="9" y2="15" />
                    <line x1="9" y1="9" x2="15" y2="15" />
                </svg>
                <p>Access denied. Unable to load this virtual tour.</p>
            </div>

            <!-- ═══ UNIFIED TOP-RIGHT PILL — Language + Sound + VR + FS + Share ═══ -->
            <div id="tourOverlay" class="tour-pill" style="display: none;">

                <!-- Language (gold text, options slide left) — populated dynamically -->
                <div class="tour-lang-row" id="tourLangRow">
                    <div class="tour-lang-options" id="tourLangOptions">
                        <!-- Populated by destination.js from dest.languages -->
                    </div>
                    <button class="tour-lang-active" id="tourLangCurrent" aria-label="Select Language">EN</button>
                </div>

                <div class="tour-pill-divider"></div>

                <!-- Sound -->
                <button id="tourMuteBtn" class="tour-fab tour-fab-sound active" aria-label="Toggle Audio">
                    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 010 7.07"/>
                        <path d="M19.07 4.93a10 10 0 010 14.14"/>
                    </svg>
                    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none;">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
                    </svg>
                </button>

                <div class="tour-pill-divider"></div>

                <!-- VR -->
                <button id="tourVrBtn" class="tour-fab tour-fab-vr" aria-label="Enter VR">
                    <span class="vr-text-label">VR</span>
                </button>

                <!-- Fullscreen -->
                <button id="tourFsBtn" class="tour-fab tour-fab-fs" aria-label="Fullscreen">
                    <svg id="tourFsEnter" class="icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
                    </svg>
                    <svg id="tourFsExit" class="icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M4 14h6v6m10-10h-6V4m0 6l7-7M3 21l7-7"/>
                    </svg>
                </button>

                <div class="tour-pill-divider"></div>

                <!-- Share -->
                <button id="shareBtn" class="tour-fab tour-fab-share" aria-label="Share">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/>
                        <polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
                    </svg>
                </button>

            </div>
        </div>
    </section>

    <!-- ═══ DESTINATION INFO ═══ -->
    <section class="dest-info-bar" id="destHero">

    <!-- ═══ LIGHTBOX ═══ -->

                stroke-linecap="round">

            </svg>
        </button>
        <img id="lightboxImg" class="dest-lightbox-img" src="" alt="">
        <div class="dest-lightbox-caption" id="lightboxCaption"></div>
        <button class="dest-lightbox-nav dest-lightbox-next" id="lightboxNext" aria-label="Next">

            </svg>
        </button>
    </div>

    <!-- ═══ VIDEO SECTION ═══ -->

        </div>
    </section>

    <!-- ═══ NEARBY DESTINATIONS ═══ -->
    <section class="section dest-related">
        <div class="container">
            <div class="section-label reveal">Discover</div>
            <h2 class="section-title reveal reveal-delay-1">Nearby Destinations</h2>
            <div class="gold-line reveal reveal-delay-2"></div>
            <div id="nearbyGrid" class="destinations-grid"></div>
        </div>
    </section>

    <!-- ═══ FOOTER ═══ -->
    <div id="footer"></div>

    <!-- Scripts

    <script src="/js/main.js?v=20260507c"></script>
    <script src="/js/destination.js?v=20260518d"></script>
    <script>
        document.getElementById('navbar').innerHTML = renderNavbar('');
        document.getElementById('footer').innerHTML = renderFooter();
    </script>
</body>
